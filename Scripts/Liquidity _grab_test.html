<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Higgs AI — Scene Script Test</title>
<style>
  :root {
    --bg: #FAF6EF;
    --panel: #FFFFFF;
    --border: #E7DFD1;
    --text: #6B5B4D;
    --text-soft: #9C8D7C;
    --up: #4E8C7A;
    --down: #C97C68;
    --gold: #B08D57;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }

  .eyebrow {
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--text-soft);
    font-family: -apple-system, "Segoe UI", sans-serif;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 28px;
    font-weight: 400;
    margin: 0 0 6px 0;
    color: #4A3B2E;
  }

  #label {
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 0.03em;
    margin-bottom: 40px;
  }

  .stage {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 30px 30px;
    box-shadow: 0 20px 40px -30px rgba(74, 59, 46, 0.25);
  }

  svg { display: block; }

  .liq-line {
    stroke: var(--gold);
    stroke-width: 1.5;
    stroke-dasharray: 6 6;
    stroke-dashoffset: 760;
    animation: drawLine 1.2s ease-out forwards;
  }

  .liq-label {
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 11px;
    fill: var(--gold);
    opacity: 0;
    animation: fadeIn 0.5s ease-out forwards;
  }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .candle-body {
    transform-box: fill-box;
    transform-origin: bottom;
    transform: scaleY(0);
    animation: growCandle 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes growCandle {
    to { transform: scaleY(1); }
  }

  .wick {
    opacity: 0;
    animation: fadeIn 0.25s ease-out forwards;
  }

  .grab-mark {
    opacity: 0;
    transform: translateY(6px);
    animation: dropIn 0.5s ease-out forwards;
  }

  @keyframes dropIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .grab-text {
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 12px;
    font-weight: 600;
    fill: var(--gold);
  }

  #raw-toggle {
    margin-top: 28px;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 12px;
    color: var(--text-soft);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
  }

  #raw {
    display: none;
    width: 640px;
    margin-top: 14px;
    font-family: "Courier New", monospace;
    font-size: 11px;
    color: var(--text-soft);
    white-space: pre-wrap;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 4px;
  }
.ob-rectangle {
  fill: rgba(176, 141, 87, 0.15);
  stroke: #B08D57;
  stroke-width: 1;
}
.fade-in-label {
  opacity: 0;
  animation: fadeIn 0.5s ease-out forwards;
}
</style>
</head>
<body>

<div class="eyebrow">Aurelin AI — Concept Replay</div>
<h1 id="title">Concept</h1>
<div id="label">Loading…</div>

<div class="stage">
  <svg id="chart" width="700" height="380" viewBox="0 0 700 380"></svg>
</div>

<button id="raw-toggle" onclick="toggleRaw()">View scene script JSON</button>
<pre id="raw"></pre>

<script>

function toggleRaw() {
      const el = document.getElementById("raw");
      el.style.display = el.style.display === "block" ? "none" : "block";
    }

fetch('scene_output.json')
  .then(response => response.json())
  .then(sceneScript => {
    document.getElementById("label").innerText = sceneScript.label || sceneScript.concept;
    document.getElementById("raw").innerText = JSON.stringify(sceneScript, null, 2);

    const svg = document.getElementById("chart");
    const svgNS = "http://www.w3.org/2000/svg";
    const candles = sceneScript.candles;

    const chartWidth = 700;
    const chartHeight = 380;
    const marginTop = 40;
    const marginBottom = 30;
    const candleWidth = 14;
    const startX = 20;
    const margin = 50;
    const gap = (chartWidth - startX - margin) / candles.length;

    let minVal = Infinity, maxVal = -Infinity;
    candles.forEach(c => {
      minVal = Math.min(minVal, c.wickLow, c.open, c.close);
      maxVal = Math.max(maxVal, c.wickHigh, c.open, c.close);
    });
    if (sceneScript.old_high_level !== undefined) {
      minVal = Math.min(minVal, sceneScript.old_high_level);
      maxVal = Math.max(maxVal, sceneScript.old_high_level);
    }

    const usableHeight = chartHeight - marginTop - marginBottom;
    const scale = usableHeight / (maxVal - minVal);

    function valToY(v) {
      return chartHeight - marginBottom - (v - minVal) * scale;
    }

    // ---- Build candle elements ----
    const candleXCenters = [];
    const candleEls = [];

    candles.forEach((c, i) => {
      const x = startX + i * gap;
      candleXCenters.push(x + candleWidth / 2);

      const isUp = c.close >= c.open;
      const color = isUp ? "#4E8C7A" : "#C97C68";

      const bodyTopVal = Math.max(c.open, c.close);
      const bodyBottomVal = Math.min(c.open, c.close);
      const bodyTopY = valToY(bodyTopVal);
      const bodyBottomY = valToY(bodyBottomVal);
      const bodyHeight = Math.max(bodyBottomY - bodyTopY, 1.5);

      const wick = document.createElementNS(svgNS, "line");
      wick.setAttribute("x1", x + candleWidth / 2);
      wick.setAttribute("x2", x + candleWidth / 2);
      wick.setAttribute("y1", valToY(c.wickHigh));
      wick.setAttribute("y2", valToY(c.wickLow));
      wick.setAttribute("stroke", color);
      wick.setAttribute("stroke-width", "1.5");

      const rect = document.createElementNS(svgNS, "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("y", bodyTopY);
      rect.setAttribute("width", candleWidth);
      rect.setAttribute("height", bodyHeight);
      rect.setAttribute("fill", color);
      rect.setAttribute("rx", "1.5");

      candleEls.push({ wick, body: rect, x, bodyTopY: bodyTopY, data: c });
    });

    // ---- Old high line + label (liquidity_grab specific, built if data present) ----
    let line, liqLabel;
    if (sceneScript.old_high_level !== undefined) {
      const levelY = valToY(sceneScript.old_high_level);
      const lineEndX = startX + candles.length * gap;

      line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", startX - 10);
      line.setAttribute("y1", levelY);
      line.setAttribute("x2", lineEndX);
      line.setAttribute("y2", levelY);

      liqLabel = document.createElementNS(svgNS, "text");
      liqLabel.setAttribute("x", lineEndX + 5);
      liqLabel.setAttribute("y", levelY + 4);
      liqLabel.classList.add("liq-label");
      liqLabel.textContent = "Old High";
    }

    // ---- Grab marker (liquidity_grab specific, built if index present) ----
    let arrow;
    if (sceneScript.grab_candle_index !== undefined) {
      const grabIndex = sceneScript.grab_candle_index;
      const grabCandle = candles[grabIndex];
      const grabX = candleXCenters[grabIndex];
      const grabY = valToY(grabCandle.wickHigh) - 14;

      arrow = document.createElementNS(svgNS, "text");
      arrow.setAttribute("x", grabX);
      arrow.setAttribute("y", grabY);
      arrow.setAttribute("text-anchor", "middle");
      arrow.classList.add("grab-text");
      arrow.textContent = "↓ Grab";
    }

    // ---- Rectangle for order_block (built on demand inside draw_rectangle action) ----
    let obRect = null;

    // ================== STEP PLAYER (generic actions) ==================

    const steps = sceneScript.steps || [];
    let candlesRevealedUpto = -1;
    let lineRevealed = false;
    let markerRevealed = false;

    function revealCandle(i, delaySec, pulse) {
      const { wick, body } = candleEls[i];
      wick.style.animationDelay = delaySec + "s";
      body.style.animationDelay = delaySec + "s";
      wick.classList.add("wick");
      body.classList.add("candle-body");
      if (pulse) {
        body.classList.add("pulse-glow");
      }
      svg.appendChild(wick);
      svg.appendChild(body);
    }

    function revealLine(delaySec) {
      if (!line || lineRevealed) return;
      line.style.animationDelay = delaySec + "s";
      liqLabel.style.animationDelay = (delaySec + 0.3) + "s";
      line.classList.add("liq-line");
      liqLabel.classList.add("fade-in-label");
      svg.appendChild(line);
      svg.appendChild(liqLabel);
      lineRevealed = true;
    }

    function revealMarker(delaySec) {
      if (!arrow || markerRevealed) return;
      arrow.style.animationDelay = delaySec + "s";
      arrow.classList.add("grab-mark");
      svg.appendChild(arrow);
      markerRevealed = true;
    }

    function drawRectangle(fromCandleId, delaySec) {
      const fromCandle = candles.find(c => c.id === fromCandleId);
      const fromIndex = candles.indexOf(fromCandle);
      const rectX = candleXCenters[fromIndex] - candleWidth / 2;
      const rectEndX = startX + candles.length * gap;
      const rectWidth = rectEndX - rectX;

      const topVal = fromCandle.wickHigh;
      const bottomVal = fromCandle.wickLow;
      const rectY = valToY(topVal);
      const rectHeight = valToY(bottomVal) - rectY;

      obRect = document.createElementNS(svgNS, "rect");
      obRect.setAttribute("x", rectX);
      obRect.setAttribute("y", rectY);
      obRect.setAttribute("width", rectWidth);
      obRect.setAttribute("height", rectHeight);
      obRect.classList.add("ob-rectangle");
      obRect.style.animationDelay = delaySec + "s";
      svg.insertBefore(obRect, svg.firstChild); // behind candles
    }

    function highlightZone() {
      if (obRect) {
        obRect.classList.add("zone-highlight-pulse");
      }
    }

    function showStep(stepData) {
      let localDelay = 0;
      const actions = stepData.actions || [];

      actions.forEach(action => {
        switch (action.type) {
          case "reveal_candles":
          case "reveal_candles_expand_up": {
            const [from, to] = action.range ? action.range : [action.candle_id, action.candle_id];
            const startIdx = candles.findIndex(c => c.id === from);
            const endIdx = candles.findIndex(c => c.id === to);
            for (let i = startIdx; i <= endIdx; i++) {
              revealCandle(i, localDelay, false);
              localDelay += 0.2;
            }
            candlesRevealedUpto = Math.max(candlesRevealedUpto, endIdx);
            break;
          }
          case "reveal_candle": {
            const idx = candles.findIndex(c => c.id === action.candle_id);
            revealCandle(idx, localDelay, false);
            localDelay += 0.2;
            break;
          }
          case "reveal_candle_with_pulse": {
            const idx = candles.findIndex(c => c.id === action.candle_id);
            revealCandle(idx, localDelay, true);
            localDelay += 0.2;
            if (action.highlight_zone) {
              highlightZone();
            }
            break;
          }
          case "draw_rectangle": {
            drawRectangle(action.from_candle, localDelay);
            localDelay += 0.3;
            break;
          }
          case "old_high_line": {
            revealLine(localDelay + 0.1);
            break;
          }
          case "grab_marker": {
            revealMarker(localDelay + 0.3);
            break;
          }
        }
      });

      // ---- Legacy support: old fixed "elements" schema (liquidity_grab) ----
      if (stepData.elements) {
        const el = stepData.elements;
        const targetUpto = el.candles_visible_upto;
        if (targetUpto !== undefined) {
          for (let i = candlesRevealedUpto + 1; i <= targetUpto; i++) {
            revealCandle(i, localDelay, false);
            localDelay += 0.2;
          }
          candlesRevealedUpto = Math.max(candlesRevealedUpto, targetUpto);
        }
        if (el.old_high_line) revealLine(localDelay + 0.1);
        if (el.grab_marker) revealMarker(localDelay + 0.3);
      }
    }

    function playSteps() {
      const STEP_INTERVAL_MS = 3000;
      steps.forEach((stepData, idx) => {
        setTimeout(() => showStep(stepData), idx * STEP_INTERVAL_MS);
      });
    }

    if (steps.length > 0) {
      playSteps();
    }
  })
  .catch(error => {
    console.error("Could not load scene_output.json:", error);
  });
</script>
</body>
</html>
